name: verify
on: [pull_request]

jobs:
  self-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Harness tests
        run: eval "$(python3 -c 'import tomllib;print(tomllib.load(open("harness.toml","rb"))["checks"]["suite"])')"  # suite from harness.toml
      - name: Lint every spec in the new format
        run: |
          rc=0
          for s in specs/0*/spec.md; do
            grep -q '^| id | requirement' "$s" || continue
            [ -f "$(dirname "$s")/result.html" ] && continue
            uv run scripts/spec.py lint "$s" || rc=1
          done
          exit $rc
