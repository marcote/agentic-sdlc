# harness.toml — which agent CLI fills each role, and how build and accept check the work.
# Placeholders in cmd: {role} {schema} {schema_json} {out} {harness} {python}.The prompt goes on stdin.

[roles]
implementer = "claude"
reviewer = "claude-ro"
reflector = "claude-ro"
curator = "claude-ro"
judge = "claude-ro"      # A7: the judge's model (family) must differ from the implementer's

[limits]
attempts = 3
budget_tokens = 3_000_000
call_seconds = 1800
suite_seconds = 25

[checks]
# {examples} expands to a pytest -k selector such as "e1_ or e2_".
# task must print one PASSED, FAILED or ERROR line per test (pytest -rA): T0 reads each example from them.
# task must run only the selected tests. No stack-neutral command can, so other stacks replace it.
task = "uv run --python 3.12 --with pytest --with jsonschema --with markdown pytest tests -q -rA -k '{examples}'"
suite = "uv run --python 3.12 --with pytest --with jsonschema --with markdown --with pytest-xdist pytest tests -q -n auto && bash tests/run.sh"
red_exit = 1

[paths]
north_star = "memory/north-star/north-star.md"
charter = "memory/stack/stack.md"
module_map = "docs/modules.md"
module_root = "src"

# ponytail: cache reads (~1/10 the input price) are left out, so tokens are a raw count; weight them by price if the budget misfires.
# Scoped Bash, never free Bash: build runs unattended on the owner's repo. git rm keeps deletions recoverable.
[cli.claude]
family = "claude-sonnet"
cmd = ["claude", "-p", "--model", "sonnet", "--output-format", "json", "--json-schema", "{schema_json}",
       "--permission-mode", "acceptEdits", "--allowedTools", "Read", "Edit", "Write",
       "Bash(uv run:*)", "Bash(git rm:*)", "Bash(git mv:*)", "Bash(mkdir:*)", "Bash(bash tests/run.sh)"]
payload = "structured_output"
tokens = ["usage.input_tokens", "usage.output_tokens", "usage.cache_creation_input_tokens"]

[cli.claude-ro]
family = "claude-opus"
cmd = ["claude", "-p", "--model", "opus", "--output-format", "json", "--json-schema", "{schema_json}", "--permission-mode", "plan"]
payload = "structured_output"
tokens = ["usage.input_tokens", "usage.output_tokens", "usage.cache_creation_input_tokens"]

# Supported, not used by default. codex reports no token usage in its last message, so the budget cannot see it; build warns.
[cli.codex]
family = "openai"
cmd = ["codex", "exec", "--full-auto", "--output-schema", "{schema}", "--output-last-message", "{out}", "-"]
payload = "@out"
tokens = []

[cli.codex-ro]
family = "openai"
cmd = ["codex", "exec", "--sandbox", "read-only", "--output-schema", "{schema}", "--output-last-message", "{out}", "-"]
payload = "@out"
tokens = []

[cli.fake]
family = "fake"
cmd = ["{python}", "{harness}/scripts/fake_agent.py", "{role}"]
payload = "result"
tokens = ["tokens"]

[cli.fake-judge]
family = "fake-2"
cmd = ["{python}", "{harness}/scripts/fake_agent.py", "{role}"]
payload = "result"
tokens = ["tokens"]
